finite-temperature:
  cover:
    image: ../../assets/research/be6b11-population.webp
    figure: "Fig. 4"
    source: 2020-buelna-garcia-be6b11
    alt:
      es: "Gráfica de población relativa frente a temperatura, de 0 a 1500 K, para los isómeros del clúster Be6B11 negativo calculada con PBE0/Def2TZVP/GD3; el isómero 1 domina a baja temperatura y el 8 por encima de unos 800 K."
      en: "Plot of relative population versus temperature, from 0 to 1500 K, for the isomers of the anionic Be6B11 cluster computed at PBE0/Def2TZVP/GD3; isomer 1 dominates at low temperature and isomer 8 above roughly 800 K."
    caption:
      es: "Poblaciones de Boltzmann de los isómeros de Be_{6}B_{11}^{−} entre 0 y 1500 K."
      en: "Boltzmann populations of the Be_{6}B_{11}^{−} isomers between 0 and 1500 K."
