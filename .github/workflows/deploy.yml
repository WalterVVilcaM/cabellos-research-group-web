# Vista previa en GitHub Pages: https://waltervvilcam.github.io/cabellos-research-group-web/
# Requisito único: Settings → Pages → Source = "GitHub Actions".
#
# Cuándo corre:
# - En cada push a main: compila y publica (no busca publicaciones).
# - Cada lunes (automático) y a mano desde Actions → "Run workflow": busca publicaciones nuevas
#   del Dr. Cabellos en OpenAlex (ORCID) + Crossref con scripts/sync-publications.mjs.
#   Solo se publica si hay algo nuevo Y pasan `astro build` y `astro check`;
#   si algo falla, la página se queda como estaba y GitHub avisa por correo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1' # lunes 07:17 hora de Tapachula (UTC-6)

permissions:
  contents: write # para guardar en main las publicaciones nuevas
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    env:
      SITE: https://waltervvilcam.github.io
      BASE_PATH: /cabellos-research-group-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Buscar publicaciones nuevas (OpenAlex + Crossref)
        id: sync
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: node scripts/sync-publications.mjs

      - name: Decidir si hay que publicar
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.sync.outputs.changed }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Sin publicaciones nuevas: no se vuelve a publicar." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload with Astro
        if: steps.decide.outputs.publish == 'true'
        uses: withastro/action@v6

      - name: Verificar contenido (astro check)
        if: steps.decide.outputs.publish == 'true'
        run: npx astro check

      - name: Guardar las publicaciones nuevas en main
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/data/publications.yaml
          git commit -m "chore(publicaciones): ${{ steps.sync.outputs.count }} publicación(es) nueva(s) desde OpenAlex"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
