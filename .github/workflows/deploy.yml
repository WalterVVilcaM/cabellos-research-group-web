# Vista previa en GitHub Pages: https://waltervvilcam.github.io/cabellos-research-group-web/
# Se publica en cada push a main (o a mano desde la pestaña Actions).
# Requisito único: Settings → Pages → Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://waltervvilcam.github.io
      BASE_PATH: /cabellos-research-group-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and upload with Astro
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
