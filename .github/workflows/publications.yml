# Búsqueda semanal de publicaciones nuevas del Dr. Cabellos (OpenAlex + Crossref).
# Reemplaza a deploy.yml: desde NOTES-F3 el sitio se sirve desde Cloudflare Workers (ADR-010) y
# GitHub Pages ya no se actualiza (queda congelado con la última versión estática).
#
# Cuándo corre:
# - Cada lunes (automático) y a mano desde Actions → "Buscar publicaciones" → "Run workflow".
# - Si hay publicaciones nuevas y pasan `astro check` y `astro build`, se guardan en main.
#   Cloudflare publica el cambio cuando el repositorio está conectado a Workers Builds;
#   si no, se publica con `npm run build` + `npm run cf:deploy`.
name: Buscar publicaciones

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1' # lunes 07:17 hora de Tapachula (UTC-6)

permissions:
  contents: write # para guardar en main las publicaciones nuevas

concurrency:
  group: publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Buscar publicaciones nuevas (OpenAlex + Crossref)
        id: sync
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: node scripts/sync-publications.mjs

      - name: Verificar (astro check + build)
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm ci
          npx astro check
          npx astro build

      - name: Guardar las publicaciones nuevas en main
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/data/publications.yaml
          git commit -m "chore(publicaciones): ${{ steps.sync.outputs.count }} publicación(es) nueva(s) desde OpenAlex"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Resumen
        if: steps.sync.outputs.changed != 'true'
        run: echo "Sin publicaciones nuevas." >> "$GITHUB_STEP_SUMMARY"
